<div class="xhs-cover">
  <div class="cover-wash" aria-hidden="true"></div>
  <div class="cover-shape" aria-hidden="true"></div>
  <div class="cover-top">
    <span class="cover-index" data-slot="page-number" data-format="plain"></span>
    <span class="cover-date" data-slot="date"></span>
  </div>
  <div class="cover-copy" data-fit-box>
    <h1 data-slot="title" data-fit-cover-title></h1>
    <p class="cover-subtitle" data-slot="subtitle"></p>
  </div>
  <div class="cover-foot">
    <span data-slot="author"></span>
    <span data-slot="brand"></span>
  </div>
</div>

<header class="blue-hero" data-when-cover="true">
  <div class="blue-hero-copy">
    <h1 class="blue-hero-title" data-slot="title"></h1>
    <p class="blue-hero-subtitle" data-slot="subtitle"></p>
  </div>
  <img class="blue-hero-image" data-slot="cover" alt="">
</header>
<header class="blue-hero blue-hero-plain" data-when-cover="false">
  <div class="blue-hero-grid" aria-hidden="true"></div>
  <div class="blue-hero-glow" aria-hidden="true"></div>
  <div class="blue-hero-copy">
    <h1 class="blue-hero-title" data-slot="title"></h1>
    <p class="blue-hero-subtitle" data-slot="subtitle"></p>
  </div>
</header>

<div class="xhs-cover doc-cover">
  <header class="doc-head">
    <span class="doc-head-field">文档编号</span>
    <span class="doc-head-no" data-slot="page-number" data-format="pad2"></span>
  </header>
  <div class="doc-titlebox" data-fit-box>
    <h1 data-slot="title" data-fit-cover-title></h1>
    <p class="cover-subtitle" data-slot="subtitle"></p>
  </div>
  <table class="doc-metatable">
    <tbody>
      <tr><th>作者</th><td data-slot="author"></td></tr>
      <tr><th>页数</th><td data-slot="page-count" data-format="plain"></td></tr>
    </tbody>
  </table>
</div>

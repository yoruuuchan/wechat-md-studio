name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: check / test / themes / sources / build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript project check
        run: npm run check

      - name: Unit tests
        run: npm test

      - name: Theme red-line verification
        run: npm run verify:themes

      - name: Theme source and credit verification
        run: npm run verify:sources

      - name: Production build
        run: npm run build
